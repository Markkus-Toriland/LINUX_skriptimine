---
# Lab 4: MySQL serveri paigaldamine Ansible abil
# Autor: Markkus Toriland
#
# Kontroll:   ansible-playbook --check /root/playbooks/mysql-server.yml
# Käivitus:   ansible-playbook /root/playbooks/mysql-server.yml
#
# Debiani (klient1) tavahoidlates MySQL serverit ei ole, seepärast lisatakse
# MySQL ametlik APT hoidla (pakett mysql-apt-config). CentOS Stream (klient2)
# hoidlates on MySQL server olemas ja see paigaldatakse dnf abil.

- hosts: webservers
  become: yes
  vars:
    mysql_apt_config: mysql-apt-config_0.8.36-1_all.deb   # viimane versioon dev.mysql.com lehelt

  tasks:
    # 1. Kataloog allalaaditud failide jaoks (moodul file)
    - name: Loome kataloogi allalaadimiseks
      file:
        path: /root/allalaadimised
        state: directory
        owner: root
        group: root
        mode: "0755"

    # 2. MySQL ametliku APT hoidla seadistuspakett (moodul shell + wget)
    - name: Laadime MySQL APT paketi wget abil
      shell: |
        wget -O /root/allalaadimised/{{ mysql_apt_config }} https://dev.mysql.com/get/{{ mysql_apt_config }}
      args:
        creates: /root/allalaadimised/{{ mysql_apt_config }}   # kui fail on olemas, uuesti ei laadi
      when: ansible_os_family == "Debian"

    # 3. gnupg on vajalik hoidla GPG-võtmete kontrollimiseks
    - name: Paigalda gnupg
      apt:
        name: gnupg
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    # 4. MySQL hoidla lisamine apt-i allikate loetellu (sama mis dpkg -i)
    - name: Installeerime mysql repositoorium
      apt:
        deb: /root/allalaadimised/{{ mysql_apt_config }}
      ignore_errors: "{{ ansible_check_mode }}"   # --check ajal faili veel ei ole
      when: ansible_os_family == "Debian"

    # 5. Pärast uue hoidla lisamist tuleb paketinimekiri uuendada
    - name: Teeme apt-le update
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    # 6. MySQL serveri paigaldamine
    - name: Paigaldame mysql-server (Debian, MySQL ametlikust hoidlast)
      apt:
        name: mysql-server
        state: present
      when: ansible_os_family == "Debian"

    - name: Paigaldame mysql-server (CentOS, pakett mysql8.4-server)
      dnf:
        name: mysql8.4-server
        state: present
      when: ansible_os_family == "RedHat"

    # 7. Teenus peab töötama ka pärast taaskäivitust
    - name: MySQL teenus käima
      service:
        name: "{{ 'mysql' if ansible_os_family == 'Debian' else 'mysqld' }}"
        state: started
        enabled: yes
