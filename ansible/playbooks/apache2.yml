---
# Lab 2: Apache2 veebiserveri paigaldamine ja userdir mooduli seadistamine
# Autor: Markkus Toriland
#
# Kontroll:   ansible-playbook --check /root/playbooks/apache2.yml
# Käivitus:   ansible-playbook /root/playbooks/apache2.yml
#
# Tulemus: igas kliendiserveris töötab veebiserver ja kasutaja "user"
# koduleht on aadressil http://kliendiserver/~user/
#
# klient1 on Debian (pakett apache2), klient2 on CentOS Stream (pakett httpd).
# Seepärast on osa ülesandeid tingimusega "when" ainult ühe OS-i perekonna jaoks.

- hosts: webservers
  vars:
    kasutaja: user                      # kasutaja, kellele koduleht tehakse
    veebiteenus: "{{ 'apache2' if ansible_os_family == 'Debian' else 'httpd' }}"

  tasks:
    # 1. Veebiserveri paigaldamine (moodul apt / dnf)
    - name: Installeerime apache2 (Debian)
      apt:
        name: apache2
        update_cache: yes
        state: latest
      when: ansible_os_family == "Debian"

    - name: Installeerime httpd (CentOS)
      dnf:
        name: httpd
        state: latest
      when: ansible_os_family == "RedHat"

    # CentOS pilvemallis kasutajat "user" ei ole, Debianis on see juba olemas
    - name: Kasutaja user peab olemas olema
      user:
        name: "{{ kasutaja }}"
        shell: /bin/bash

    # Debian 13 teeb kodukataloogid õigustega 0700 - veebiserver peab
    # saama kataloogist läbi minna, seega anname teistele x-õiguse (0711)
    - name: Kodukataloogi õigused 0711
      file:
        path: "/home/{{ kasutaja }}"
        mode: "0711"

    # 2. public_html kataloog (moodul file)
    - name: Loome public_html kataloog user_ile
      file:
        path: "/home/{{ kasutaja }}/public_html"
        state: directory
        owner: "{{ kasutaja }}"
        group: "{{ kasutaja }}"
        mode: "0755"

    # 3. userdir mooduli lubamine
    - name: Lubame userdir mod (Debian, moodul apache2_module)
      community.general.apache2_module:
        name: userdir
        state: present
      when: ansible_os_family == "Debian"

    # CentOS-is on mod_userdir laaditud, aga userdir.conf failis välja lülitatud
    - name: Lubame UserDir public_html (CentOS)
      copy:
        dest: /etc/httpd/conf.d/userdir.conf
        mode: "0644"
        content: |
          # Ansible: kasutajate kodulehed aadressil http://server/~kasutaja/
          <IfModule mod_userdir.c>
              UserDir public_html
          </IfModule>
          <Directory "/home/*/public_html">
              AllowOverride FileInfo AuthConfig Limit Indexes
              Options MultiViews Indexes SymLinksIfOwnerMatch IncludesNoExec
              Require method GET POST OPTIONS
          </Directory>
      when: ansible_os_family == "RedHat"

    # SELinux keelab vaikimisi veebiserveril kodukataloogide lugemise
    - name: SELinux lubab httpd-l kodukatalooge lugeda (CentOS)
      ansible.posix.seboolean:
        name: httpd_enable_homedirs
        state: yes
        persistent: yes
      when: ansible_os_family == "RedHat"

    # 4. Veebiserveri taaskäivitamine (moodul service)
    - name: Apache2 serverile algladimine (restart)
      service:
        name: "{{ veebiteenus }}"
        state: restarted
        enabled: yes

    # 5. index.html kasutaja public_html kataloogi (moodul copy)
    - name: Kopeerime index.html fail USER_ile kodus_public_html kataloogi (Debian)
      copy:
        src: /var/www/html/index.html
        dest: "/home/{{ kasutaja }}/public_html/"
        remote_src: yes
        force: no                       # ei kirjuta olemasolevat lehte üle
        owner: "{{ kasutaja }}"
        group: "{{ kasutaja }}"
      ignore_errors: "{{ ansible_check_mode }}"   # --check ajal kataloogi veel ei ole
      when: ansible_os_family == "Debian"

    # CentOS-is /var/www/html/index.html faili ei ole, teeme lihtsa lehe ise
    - name: Loome index.html faili USER_ile (CentOS)
      copy:
        dest: "/home/{{ kasutaja }}/public_html/index.html"
        owner: "{{ kasutaja }}"
        group: "{{ kasutaja }}"
        mode: "0644"
        force: no
        content: |
          <html>
          <head><title>Apache2 Default Page</title></head>
          <body>
          <h1>
          Apache2 Default Page
          </h1>
          <p>CentOS Stream - httpd veebiserver</p>
          </body>
          </html>
      ignore_errors: "{{ ansible_check_mode }}"   # --check ajal kataloogi veel ei ole
      when: ansible_os_family == "RedHat"

    # 6. Kodulehe muutmine "oma päraseks" (moodul lineinfile)
    - name: user index.html redigeerimine
      lineinfile:
        dest: "/home/{{ kasutaja }}/public_html/index.html"
        regexp: '^\s*Apache2 (Debian )?Default Page\s*$'   # ainult pealkirja rida
        line: "USERi lehekylg ({{ ansible_hostname }})"
        state: present
      ignore_errors: "{{ ansible_check_mode }}"   # --check ajal faili veel ei ole

    # Taaskäivitame veebiserveri lõpus veel kord
    - name: Algladimine Apache2
      service:
        name: "{{ veebiteenus }}"
        state: restarted
