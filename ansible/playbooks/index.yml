---
# Lab 2 iseseisev ülesanne: Apache2 vaikelehe asendamine
# Autor: Markkus Toriland
#
# Igas kliendiserveris asendatakse /var/www/html/index.html unikaalse lehega,
# kus on tervitus, serveri hostinimi ja IP-aadress (Ansible facts muutujad).
#
# Kontroll:   ansible-playbook --check /root/playbooks/index.yml
# Käivitus:   ansible-playbook /root/playbooks/index.yml

- hosts: webservers
  tasks:
    - name: Unikaalne avaleht igale kliendiserverile
      copy:
        dest: /var/www/html/index.html
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html lang="et">
          <head>
            <meta charset="utf-8">
            <title>{{ ansible_hostname }}</title>
          </head>
          <body>
            <h1>Tere tulemast serverisse {{ ansible_hostname }}!</h1>
            <p>Hostinimi: <b>{{ ansible_hostname }}</b></p>
            <p>IP-aadress: <b>{{ ansible_default_ipv4.address }}</b></p>
            <p>Operatsioonisüsteem: {{ ansible_distribution }} {{ ansible_distribution_version }}</p>
            <p>Lehe paigaldas Ansible - Markkus Toriland</p>
          </body>
          </html>
